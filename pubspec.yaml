name: eldcare_caretaker_app
description: A new Flutter project.

# Prevent accidental publishing to pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core packages

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  provider: ^6.1.2

  http: ^1.2.0

  # Storage & persistence
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  file_picker: ^10.3.10

  # Firebase
  firebase_core: ^2.24.2
  firebase_database: ^10.4.0



  # Notifications & reminders
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # Speech & accessibility
  flutter_tts: ^4.2.5
  speech_to_text: ^7.3.0

  # UI & utilities
  google_maps_flutter: ^2.6.1
  url_launcher: ^6.2.5
  flutter_pdfview: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
